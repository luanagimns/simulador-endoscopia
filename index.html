<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Endoscopia Virtual</title>
<style>
    body { 
        background-color: #111; 
        color: #eee; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        margin: 0; 
        padding: 20px; 
    }
    h1 { margin-top: 0; color: #4CAF50; }
    p { margin-bottom: 30px; color: #aaa; }
    
    .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
    
    .simulator-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    
    .simulator { position: relative; width: 600px; height: 600px; }
    
    /* Lente do Endoscópio */
    canvas { 
        background: #000; 
        cursor: crosshair; 
        border-radius: 50%; 
        box-shadow: 0 0 30px #000 inset, 0 0 15px rgba(255,255,255,0.1); 
    }
    
    .overlay { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        pointer-events: none; 
        border-radius: 50%; 
        box-shadow: inset 0 0 100px 50px rgba(0,0,0,0.95); 
    }
    
    .crosshair { 
        position: absolute; top: 50%; left: 50%; 
        width: 30px; height: 30px; 
        border: 2px solid rgba(0, 255, 0, 0.4); 
        border-radius: 50%; 
        transform: translate(-50%, -50%); 
        pointer-events: none; 
    }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(0, 255, 0, 0.4); }
    .crosshair::before { top: 14px; left: -10px; width: 50px; height: 2px; }
    .crosshair::after { top: -10px; left: 14px; width: 2px; height: 50px; }
    
    .hud { 
        position: absolute; top: 30px; left: 30px; 
        color: #0f0; font-family: monospace; font-size: 16px; 
        pointer-events: none; text-shadow: 1px 1px 2px #000;
    }
    .hud .rec { color: red; font-weight: bold; animation: blink 1s infinite; }
    
    .lesion-info { 
        position: absolute; bottom: 50px; left: 50%; 
        transform: translateX(-50%); 
        color: #ffeb3b; font-weight: bold; font-size: 20px; 
        pointer-events: none; text-shadow: 2px 2px 4px #000; 
        background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;
        display: none;
    }
    
    .controls { margin-top: 25px; display: flex; gap: 15px; }
    button { 
        background: #4CAF50; color: #fff; border: none; 
        padding: 12px 24px; font-size: 16px; font-weight: bold; 
        cursor: pointer; border-radius: 8px; transition: 0.2s;
    }
    button:hover { background: #45a049; transform: scale(1.05); }
    button.secondary { background: #555; }
    button.secondary:hover { background: #666; }
    
    /* Painel de Biópsias */
    .sidebar { 
        width: 350px; background: #1a1a1a; padding: 20px; 
        border-radius: 12px; border: 1px solid #333;
        max-height: 600px; overflow-y: auto; 
    }
    .sidebar h3 { margin-top: 0; color: #4CAF50; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .biopsy-item { 
        margin-bottom: 15px; border: 1px solid #444; 
        padding: 10px; background: #000; border-radius: 8px;
    }
    .biopsy-item img { width: 100%; border-radius: 50%; margin-bottom: 10px; border: 2px solid #333; }
    .biopsy-item strong { color: #2196F3; }
    
    @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<h1>Simulador de Endoscopia Virtual</h1>
<p>Mova o cursor sobre o visor para direcionar a câmera. Encontre lesões no estômago e colete biópsias.</p>

<div class="container">
    <div class="simulator-wrapper">
        <div class="simulator">
            <canvas id="endoCanvas" width="600" height="600"></canvas>
            <div class="overlay"></div>
            <div class="crosshair"></div>
            <div class="hud" id="hud"><span class="rec">● REC</span><br>CH: 01<br>DEPTH: 45cm</div>
            <div class="lesion-info" id="lesionInfo"></div>
        </div>
        
        <div class="controls">
            <button onclick="takeBiopsy()">📸 Coletar Biópsia</button>
            <button class="secondary" onclick="resetCamera()">Recentralizar Câmera</button>
        </div>
    </div>

    <div class="sidebar">
        <h3>Galeria de Biópsias</h3>
        <div id="gallery">
            <div style="color: #666; text-align: center; margin-top: 20px;">Nenhuma biópsia coletada ainda.</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('endoCanvas');
    const ctx = canvas.getContext('2d');
    const lesionInfo = document.getElementById('lesionInfo');
    const gallery = document.getElementById('gallery');
    let biopsiesCount = 0;

    // Tamanho do "Mundo" (Estômago virtual)
    const WORLD_W = 2500;
    const WORLD_H = 2500;
    
    // Configurações da Câmera
    let camX = WORLD_W / 2;
    let camY = WORLD_H / 2;
    let targetCamX = camX;
    let targetCamY = camY;

    // Definição das Lesões espalhadas pelo mapa
    const lesions = [
        { x: 800, y: 700, r: 80, name: "Gastrite Erosiva", type: "gastritis" },
        { x: 1800, y: 900, r: 100, name: "Gastrite Erosiva", type: "gastritis" },
        { x: 1000, y: 1600, r: 70, name: "Úlcera Péptica Profunda", type: "ulcer" },
        { x: 1700, y: 1800, r: 50, name: "Úlcera Péptica Profunda", type: "ulcer" },
        { x: 1300, y: 1200, r: 60, name: "Gastrite Leve", type: "gastritis" }
    ];

    // Criação procedural da textura da mucosa (Off-screen canvas)
    const mucosaCanvas = document.createElement('canvas');
    mucosaCanvas.width = WORLD_W;
    mucosaCanvas.height = WORLD_H;
    const mCtx = mucosaCanvas.getContext('2d');

    function generateMucosa() {
        // Cor base do estômago (rosa carne)
        mCtx.fillStyle = '#b34747'; 
        mCtx.fillRect(0, 0, WORLD_W, WORLD_H);
        
        // Gerar dobras e vasos sanguíneos básicos com ruído
        for(let i = 0; i < 1500; i++) {
            mCtx.beginPath();
            let x = Math.random() * WORLD_W;
            let y = Math.random() * WORLD_H;
            let r = Math.random() * 200 + 50;
            let grad = mCtx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, 'rgba(210, 60, 60, 0.15)');
            grad.addColorStop(1, 'rgba(150, 30, 30, 0)');
            mCtx.fillStyle = grad;
            mCtx.arc(x, y, r, 0, Math.PI * 2);
            mCtx.fill();
        }

        // Desenhar as lesões no mapa
        lesions.forEach(l => {
            if (l.type === 'gastritis') {
                // Áreas vermelhas e inflamadas
                let grad = mCtx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
                grad.addColorStop(0, 'rgba(230, 10, 10, 0.9)'); 
                grad.addColorStop(0.5, 'rgba(200, 30, 30, 0.6)');
                grad.addColorStop(1, 'rgba(179, 71, 71, 0)');
                mCtx.fillStyle = grad;
                mCtx.beginPath();
                mCtx.arc(l.x, l.y, l.r, 0, Math.PI*2);
                mCtx.fill();
                
                // Pontos de erosão
                for(let j = 0; j < 15; j++) {
                    mCtx.fillStyle = 'rgba(100, 0, 0, 0.7)';
                    mCtx.beginPath();
                    mCtx.arc(l.x + (Math.random()-0.5)*l.r, l.y + (Math.random()-0.5)*l.r, Math.random()*6, 0, Math.PI*2);
                    mCtx.fill();
                }
            } else if (l.type === 'ulcer') {
                // Base da úlcera (amarelada/branca por fibrina)
                let grad = mCtx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
                grad.addColorStop(0, '#f0e6c8'); // Centro claro
                grad.addColorStop(0.5, '#d4c794');
                grad.addColorStop(0.7, '#9e1a1a'); // Borda elevada e avermelhada
                grad.addColorStop(1, 'rgba(179, 71, 71, 0)');
                mCtx.fillStyle = grad;
                mCtx.beginPath();
                mCtx.arc(l.x, l.y, l.r, 0, Math.PI*2);
                mCtx.fill();
                
                // Sombra para criar ilusão de profundidade (cratera)
                mCtx.strokeStyle = 'rgba(40,0,0,0.6)';
                mCtx.lineWidth = 5;
                mCtx.beginPath();
                mCtx.arc(l.x, l.y, l.r*0.65, 0, Math.PI*2);
                mCtx.stroke();
            }
        });
    }

    generateMucosa();

    // Controle da câmera via mouse
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        
        // Normalizar posição do mouse entre -1 e 1
        const nx = (mx / canvas.width) * 2 - 1;
        const ny = (my / canvas.height) * 2 - 1;

        // A velocidade de deslocamento aumenta quanto mais perto da borda o mouse estiver
        targetCamX += nx * 20;
        targetCamY += ny * 20;

        // Impedir que a câmera saia do estômago virtual
        targetCamX = Math.max(canvas.width/2, Math.min(WORLD_W - canvas.width/2, targetCamX));
        targetCamY = Math.max(canvas.height/2, Math.min(WORLD_H - canvas.height/2, targetCamY));
    });

    // Clique na câmera também tira biópsia
    canvas.addEventListener('click', takeBiopsy);

    function resetCamera() {
        targetCamX = WORLD_W / 2;
        targetCamY = WORLD_H / 2;
    }

    function takeBiopsy() {
        if (biopsiesCount === 0) gallery.innerHTML = ""; // Limpa a mensagem padrão
        
        biopsiesCount++;
        const img = document.createElement('img');
        img.src = canvas.toDataURL('image/png'); // Captura o frame atual
        
        // Determinar o diagnóstico da biópsia baseado no centro da câmera
        let lesionFound = "Tecido de Mucosa Normal";
        lesions.forEach(l => {
            const dist = Math.hypot(camX - l.x, camY - l.y);
            if (dist < l.r + 40) {
                lesionFound = l.name;
            }
        });

        const div = document.createElement('div');
        div.className = 'biopsy-item';
        div.innerHTML = `
            <small style="color:#aaa">Biópsia #${biopsiesCount}</small><br>
            <strong>Diagnóstico:</strong> ${lesionFound}<br>
            <small>Coordenadas (X: ${Math.floor(camX)}, Y: ${Math.floor(camY)})</small>
        `;
        div.insertBefore(img, div.firstChild);
        
        gallery.prepend(div);
    }

    // Loop principal de renderização
    function update() {
        // Movimento suave da câmera (Easing)
        camX += (targetCamX - camX) * 0.08;
        camY += (targetCamY - camY) * 0.08;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Renderizar a porção visível do estômago baseada na posição da câmera
        const sx = camX - canvas.width / 2;
        const sy = camY - canvas.height / 2;
        ctx.drawImage(mucosaCanvas, sx, sy, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);

        // Detectar se há uma lesão na mira central
        let detected = false;
        lesions.forEach(l => {
            const dist = Math.hypot(camX - l.x, camY - l.y);
            if (dist < l.r + 60) {
                lesionInfo.textContent = "ALVO CLÍNICO: " + l.name.toUpperCase();
                lesionInfo.style.display = "block";
                detected = true;
            }
        });
        
        if (!detected) {
            lesionInfo.style.display = "none";
        }

        // Simulação da luz do endoscópio (centro brilhante, bordas escurecidas)
        let lightGrad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, canvas.width/2);
        lightGrad.addColorStop(0, 'rgba(255,255,255,0.15)');
        lightGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
        lightGrad.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = lightGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Artefato de câmera: pequenos "glitches" ou flashes aleatórios de luz
        if(Math.random() > 0.985) {
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        requestAnimationFrame(update);
    }

    update();
</script>

</body>
</html>
